name: macOS Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sign:
        description: Sign the packaged app with the configured macOS certificate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  APP_PATH: dist/Vantage.app

jobs:
  build:
    name: Test and package unsigned app
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Swift 6.1 toolchain
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_16.4*.app' -print -quit)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 16.4 was not found on the macOS runner." >&2
            find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Build unsigned app bundle
        run: SKIP_SIGN=1 ./Scripts/package_app.sh release

      - name: Validate app bundle
        run: |
          test -x "$APP_PATH/Contents/MacOS/Vantage"
          test -f "$APP_PATH/Contents/Info.plist"
          test -f "$APP_PATH/Contents/Resources/Vantage_Vantage.bundle/en.json"
          test -f "$APP_PATH/Contents/Resources/Vantage_Vantage.bundle/zh-Hans.json"
          plutil -lint "$APP_PATH/Contents/Info.plist"

      - name: Archive unsigned app
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/Vantage-unsigned-${GITHUB_SHA}.zip"

      - name: Upload unsigned archive
        uses: actions/upload-artifact@v4
        with:
          name: vantage-unsigned-${{ github.sha }}
          path: dist/Vantage-unsigned-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign app bundle
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    environment: release

    steps:
      - name: Download unsigned archive
        uses: actions/download-artifact@v4
        with:
          name: vantage-unsigned-${{ github.sha }}
          path: dist

      - name: Extract unsigned app
        run: |
          set -euo pipefail
          ditto -x -k "dist/Vantage-unsigned-${GITHUB_SHA}.zip" dist
          test -x "$APP_PATH/Contents/MacOS/Vantage"

      - name: Validate signing secrets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$MACOS_CERTIFICATE_P12_BASE64" ]] || missing+=(MACOS_CERTIFICATE_P12_BASE64)
          [[ -n "$MACOS_CERTIFICATE_PASSWORD" ]] || missing+=(MACOS_CERTIFICATE_PASSWORD)
          [[ -n "$MACOS_KEYCHAIN_PASSWORD" ]] || missing+=(MACOS_KEYCHAIN_PASSWORD)
          [[ -n "$MACOS_SIGNING_IDENTITY" ]] || missing+=(MACOS_SIGNING_IDENTITY)

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing secrets in the release environment:\n' >&2
            printf '  %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Create temporary signing keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/vantage-build.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/vantage-signing.p12"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" \
            -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$MACOS_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "Imported signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Sign app bundle
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$MACOS_SIGNING_IDENTITY"
          AVAILABLE_IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          if ! grep -Fq "\"$MACOS_SIGNING_IDENTITY\"" <<< "$AVAILABLE_IDENTITIES"; then
            echo "MACOS_SIGNING_IDENTITY was not found in the imported keychain." >&2
            echo "Configured identity: $MACOS_SIGNING_IDENTITY" >&2
            echo "Available identities:" >&2
            printf '%s\n' "$AVAILABLE_IDENTITIES" >&2
            exit 1
          fi
          codesign \
            --force \
            --deep \
            --options runtime \
            --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 --keychain "$KEYCHAIN_PATH" "$APP_PATH"

      - name: Create signed archive
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/Vantage-signed-${GITHUB_SHA}.zip"

      - name: Upload signed archive
        uses: actions/upload-artifact@v4
        with:
          name: vantage-signed-${{ github.sha }}
          path: dist/Vantage-signed-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/vantage-build.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" || true

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: sign
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed archive
        uses: actions/download-artifact@v4
        with:
          name: vantage-signed-${{ github.sha }}
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SIGNED_ARCHIVE="$(find dist -maxdepth 1 -name 'Vantage-signed-*.zip' -print -quit)"
          test -n "$SIGNED_ARCHIVE"
          RELEASE_ARCHIVE="dist/Vantage-${GITHUB_REF_NAME}.zip"
          mv "$SIGNED_ARCHIVE" "$RELEASE_ARCHIVE"
          gh release create "$GITHUB_REF_NAME" "$RELEASE_ARCHIVE" --generate-notes --verify-tag
